<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSINT HUB // rdw3w</title>
<script>
// Local test ke liye — isko browser me directly kholo
// APIs directly call hongi (CORS depends on API provider)
// For full functionality, deploy index.js on Cloudflare Workers

const API_BASE = ''; // Cloudflare pe deploy hone ke baad yahan worker URL daalo

async function lookupVehicle() {
  const rc = document.getElementById('rcInput').value.trim().toUpperCase();
  if (!rc) return alert('RC number daalo');
  const res = await fetch((API_BASE || 'https://vvvin-ng.vercel.app') + '/lookup?rc=' + encodeURIComponent(rc));
  const data = await res.json();
  document.getElementById('rcResult').textContent = JSON.stringify(data, null, 2);
}

async function lookupMobile() {
  const num = document.getElementById('mobInput').value.trim();
  if (!num) return alert('Number daalo');
  const res = await fetch('https://spring-bonus-b26f.rudrasingh221204.workers.dev/lookup?num=' + encodeURIComponent(num));
  const data = await res.json();
  document.getElementById('mobResult').textContent = JSON.stringify(data, null, 2);
}

async function lookupPincode() {
  const q = document.getElementById('pinInput').value.trim();
  if (!q) return alert('Pincode daalo');
  const res = await fetch('https://spring-bonus-b26f.rudrasingh221204.workers.dev/pincode?q=' + encodeURIComponent(q));
  const data = await res.json();
  document.getElementById('pinResult').textContent = JSON.stringify(data, null, 2);
}
</script>
<style>
body{background:#050508;color:#c8d6e5;font-family:monospace;padding:20px}
input{padding:10px;background:#111;border:1px solid #00f3ff40;color:#fff;border-radius:6px;width:60%}
button{padding:10px 20px;background:#00f3ff20;color:#00f3ff;border:1px solid #00f3ff;border-radius:6px;cursor:pointer}
pre{background:#000a;padding:16px;border-radius:8px;border:1px solid #00f3ff30;overflow:auto;max-height:400px;margin-top:10px;white-space:pre-wrap}
section{margin:30px 0}
</style>
</head>
<body>
<h1>OSINT HUB // rdw3w (Local Test)</h1>
<section>
  <h2>Vehicle</h2>
  <input id="rcInput" placeholder="MH12DE1433">
  <button onclick="lookupVehicle()">Scan</button>
  <pre id="rcResult"></pre>
</section>
<section>
  <h2>Mobile</h2>
  <input id="mobInput" placeholder="9876543210">
  <button onclick="lookupMobile()">Trace</button>
  <pre id="mobResult"></pre>
</section>
<section>
  <h2>Pincode</h2>
  <input id="pinInput" placeholder="110001">
  <button onclick="lookupPincode()">Search</button>
  <pre id="pinResult"></pre>
</section>
<p style="color:#4a5568;margin-top:40px">Note: Ye local test page hai. Full UI ke liye Cloudflare Workers pe deploy karo index.js</p>
</body>
</html>
